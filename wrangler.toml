# קונפיגורציה ל-Cloudflare Pages (דרך wrangler deploy המאוחד).
#
# ה-KV binding לטבלת השיאים (functions/api/leaderboard.js) לא מוגדר כאן בכוונה -
# עדיף להגדיר אותו ב-Dashboard כדי שלא יהיה מזהה שגוי בקוד שמפיל את ה-build:
#   Pages project -> Settings -> Functions -> KV namespace bindings
#   Variable name: LEADERBOARD_KV
#
# לפיתוח מקומי בלבד (לא נדרש לפריסה), אפשר להריץ עם binding זמני בלי לגעת בקובץ:
#   npx wrangler kv namespace create LEADERBOARD_KV   # פעם אחת, שומר את המזהה בפלט
#   npx wrangler pages dev . --kv LEADERBOARD_KV

name = "yosovich-shabbat-rush"
pages_build_output_dir = "."
