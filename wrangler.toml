# קובץ זה עוזר לפיתוח מקומי (`wrangler pages dev .`) ולתיעוד ה-KV binding
# הנדרש לטבלת השיאים ב-functions/api/leaderboard.js.
#
# בפריסה רגילה דרך חיבור Git ב-Cloudflare Pages (ללא CLI), אפשר גם לוותר על
# הקובץ הזה ולהגדיר את ה-binding ישירות ב-Dashboard:
#   Pages project -> Settings -> Functions -> KV namespace bindings
#   Variable name: LEADERBOARD_KV
#
# אם כן רוצים להשתמש ב-wrangler, יש ליצור namespace ולעדכן כאן את ה-id:
#   npx wrangler kv namespace create LEADERBOARD_KV
# ואז להעתיק את ה-id שמתקבל במקום הערך למטה.

name = "yosovich-shabbat-rush"
pages_build_output_dir = "."

[[kv_namespaces]]
binding = "LEADERBOARD_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
